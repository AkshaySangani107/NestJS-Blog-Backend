name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Backend
        run: |
          curl --fail --silent --show-error \
          "https://nestjs-blog-backend-b0dk.onrender.com/post/pagination/data?page=1"